<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="output.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hexhound Field Interface</title>
</head>

<body
    class="flex flex-col items-center justify-around bg-gradient-to-br from-[#EAA90999] to-[#78DDAB99] w-screen h-screen gap-10 py-10">
    
    <div
        class="flex flex-row align-center justify-center px-20 py-2 rounded-xl bg-white/50 shadow-lg select-none border-1 border-gray-400">
        <h1 class="text-2xl">Hexhounds Field Interface</h1>
    </div>

    <div class="flex items-center justify-center flex-1">
        <div
            class="aspect-square h-full px-5 bg-[#f5df31] rounded-4xl inset-shadow-sm inset-shadow-[#c9b300]/100 select-none flex items-center justify-center">
            <h1 id="fuel-score-text" class="text-[35vh]"></h1>
        </div>
    </div>

    <div class="flex flex-row gap-5">
        <button onclick="subtract()"
            class="px-4 py-1 cursor-pointer hover:ring-2 ring-gray-700 hover:-translate-y-[1px] transition duration-200 rounded-lg bg-white/50 shadow-lg select-none border-1 border-gray-400">-</button>
        <button onclick="reset()"
            class="px-8 py-1 cursor-pointer hover:ring-2 hover:-translate-y-[1px] transition duration-200 rounded-lg bg-white/50 shadow-lg select-none border-1 border-gray-400">Reset</button>
        <button onclick="add()"
            class="px-4 py-1 cursor-pointer hover:ring-2 ring-gray-700 hover:-translate-y-[1px] transition duration-200 rounded-lg bg-white/50 shadow-lg select-none border-1 border-gray-400">+</button>
    </div>

    <div id="connection-status"
        class="select-none fixed top-5 right-5 bg-gray-400/100 border-1 border-gray-800 rounded-lg px-3 py-1 shadow-md">
        Disconnected
    </div>

    <button onclick="openSidebar()" id="open-sidebar-button" class="select-none fixed top-4 left-4 hover:bg-gray-400/75 transition cursor-pointer bg-gray-300/50 border-1 border-gray-500 rounded-lg px-2 py-2 shadow-md">
        <i data-lucide="menu"></i>
    </button>
    
    <div id="sidebar-container" class="select-none fixed left-0 flex flex-col gap-2 h-[98vh] w-55 -translate-x-56 items-center top-[1vh] px-5 py-5 rounded-r-lg bg-white/50 border-r-1 border-t-1 border-b-1 shadow-lg border-gray-400">
        <i onclick="closeSidebar()" data-lucide="arrow-left-from-line" class="self-end cursor-pointer hover:scale-105"></i>
        <a href="/" class="text-lg py-2 cursor-pointer hover:underline">Simple Counter</a>
        <a href="/full-match" class="text-lg py-2 cursor-pointer hover:underline">Data Counter</a>
        <a href="/data-viewer" class="text-lg py-2 cursor-pointer hover:underline">Data Viewer</a>
        <a href="/" class="text-lg py-2 cursor-pointer hover:underline">Camera Stream</a>
    </div>

</body>
<script src="lucid.min.js"></script>
<script src="socket.io.min.js"></script>
<script src="gsap.min.js"></script>
<script src="client.js"></script>

</html>
